# Site Settings
title                    : "Changhai Zhou"
seo_title                : "Changhai Zhou (周昌海) | Academic Homepage"
description              : "Changhai Zhou is a PhD candidate at Fudan University (周昌海, zhouchanghai / changhaizhou) working across the full stack of trillion-parameter (T-scale) foundation models—from pre-training and mid-training to post-training—as well as efficient LLMs, model compression, PEFT, adaptive inference, and LLM serving."
keywords                 : "Changhai Zhou, 周昌海, zhouchanghai, changhaizhou, Zhou Changhai, Fudan University, 复旦大学, Full-Stack LLM, Trillion-Parameter Models, Pre-training, Mid-training, Post-training, Efficient LLMs, Model Compression, PEFT, Adaptive Inference, LLM Serving"
repository               : "changhaizhou98/changhaizhou98.github.io"
url                      : "https://changhaizhou98.github.io"
baseurl                  : ""

author:
  name             : "Changhai Zhou"
  chinese_name     : "周昌海"
  aliases          :
    - "周昌海"
    - "Changhai Zhou"
    - "Zhou Changhai"
    - "zhouchanghai"
    - "changhaizhou"
    - "changhaizhou98"
  avatar           : "images/me.png"
  bio              : "PhD Candidate at Fudan University | Full-Stack T-Scale LLMs (Pre-/Mid-/Post-Training) & Efficient LLM Systems"
  location         : "Shanghai, China"
  employer         : "Fudan University"
  googlescholar    : "https://scholar.google.com/citations?user=mM3rnV4AAAAJ&hl=zh-CN"
  email            : "chzhou25@m.fudan.edu.cn"
  github           : "changhaizhou98"

include:
  - _pages
exclude:
  - _site
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - vendor
  - node_modules
  - docs
  - tests
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
